name: Headless foundation

# Configuration only until an authorized actor dispatches it on suitable runners.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    strategy:
      fail-fast: true
      matrix:
        os: [macOS, Linux]
    # Required labels/preconditions, not a claim that runners are registered.
    runs-on: [self-hosted, '${{ matrix.os }}', ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run existing native offline gates
        id: checks
        run: bash tests/integration/foundation/check-headless.sh
      - name: Retain structured nonsensitive fixture reports
        if: always() && steps.checks.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.os }}-ARM64
          if-no-files-found: error
          path: |
            ${{ steps.checks.outputs.artifacts }}/prepare/environment.json
            ${{ steps.checks.outputs.artifacts }}/unit/environment.json
            ${{ steps.checks.outputs.artifacts }}/integration/environment.json
            ${{ steps.checks.outputs.artifacts }}/integration/contracts.json
            ${{ steps.checks.outputs.artifacts }}/persistence/environment.json
            ${{ steps.checks.outputs.artifacts }}/persistence/cross-volume.json
            ${{ steps.checks.outputs.artifacts }}/persistence/crash-boundaries.jsonl
            ${{ steps.checks.outputs.artifacts }}/persistence/real-inputs.json
            ${{ steps.checks.outputs.artifacts }}/e2e/environment.json
            ${{ steps.checks.outputs.artifacts }}/e2e/f12.json
            ${{ steps.checks.outputs.artifacts }}/e2e/f12-http.json
