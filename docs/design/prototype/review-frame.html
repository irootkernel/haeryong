<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Haeryong design review frame</title>
<style>body{margin:0;background:#dce2e9;font:14px system-ui;color:#172033}header{position:sticky;top:0;left:0;z-index:3;background:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #bcc7d6}button{background:#fff;border:1px solid #bcc7d6;border-radius:6px;min-height:40px;padding:0 12px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#175cd3;color:white}main{padding:16px;width:max-content}iframe{display:block;width:1440px;height:900px;border:0;background:white;box-shadow:0 4px 24px #17203322}a{color:#175cd3;margin-left:12px}</style>
<header><strong>디자인 검토</strong><button data-w="1440" data-h="900" aria-pressed="true">Desktop 1440 × 900</button><button data-w="1280" data-h="800" aria-pressed="false">Desktop 1280 × 800</button><button data-w="820" data-h="1180" aria-pressed="false">Tablet 820 × 1180</button><button data-w="390" data-h="844" aria-pressed="false">Phone 390 × 844</button><button data-w="844" data-h="390" aria-pressed="false">Landscape 844 × 390</button><a href="prototype.html">시안만 열기</a></header>
<main><iframe id="preview" title="Haeryong prototype" src="prototype.html"></iframe></main>
<script>document.querySelectorAll('button[data-w]').forEach(button=>button.addEventListener('click',()=>{const frame=document.querySelector('iframe');frame.style.width=button.dataset.w+'px';frame.style.height=button.dataset.h+'px';document.querySelectorAll('button[data-w]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));}));</script></html>
