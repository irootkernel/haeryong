      '준비 · 현재 소유권은 실행 세대 1입니다. 아직 결과를 만들지 않았습니다.',
      '1 / 3 · 실행 세대 1이 결과를 만들었습니다. 결과는 아직 저장되지 않았습니다.',
      '2 / 3 · 새 실행 세대 2가 소유권을 이어받았습니다. 이전 결과는 여전히 실행 세대 1의 소유권을 갖고 있습니다.',
      '3 / 3 · 이전 결과가 도착했지만 현재 소유권과 달라 거절됐습니다. 저장된 결과는 바뀌지 않았습니다.'
    ];
    let status = byId('simulationResult') || byId('readerSimulationStatus') || (node.matches('output, [role="status"]') ? node : node.querySelector('[data-simulation-status]'));
    if (!status) {
      status = document.createElement('p');
      status.id = 'readerSimulationStatus';
      status.className = 'notice small';
      status.dataset.simulationStatus = 'true';
      status.setAttribute('role', 'status');
      if (node.matches('button,input')) {
        const anchor = node.parentElement && node.parentElement.tagName === 'P' ? node.parentElement : node;
        anchor.insertAdjacentElement('afterend', status);
      } else node.appendChild(status);
    }
    status.textContent = messages[index];
    const labels = ['결과 만들기', '새 실행으로 소유권 넘기기', '이전 결과 도착시키기', '처음부터 다시'];
    actions('simulate').forEach(button => { button.textContent = labels[index]; });
  }

  function redrawContext() {
    HR.renderContext();
  }

  function openContext(name, button) {
    if (!contextNames.has(name)) return false;
    if (!state().context && button) contextOpener = { id: button.id, action: button.dataset.action };
    if (name === 'ask') questionDraft(true);
    state().context = name;
    redrawContext();
    const focusId = name === 'ask' ? 'questionInput' : name === 'notes' ? 'noteInput' : null;
    if (focusId) {
      const input = byId(focusId);
      if (input) input.focus({ preventScroll: true });
    }
    return true;
  }

  function closeContext() {
    state().context = null;
    redrawContext();
    const opener = contextOpener && ((contextOpener.id && byId(contextOpener.id)) || actions(contextOpener.action)[0]);
    if (opener && opener.isConnected) opener.focus({ preventScroll: true });
    contextOpener = null;
    return true;
  }

  function openPage(pageId, versionId) {
    const doc = HR.doc();
    const version = doc && doc.versions[versionId || state().versionId];
    if (!version || !version.pages[pageId]) { HR.toast('이 버전에는 해당 페이지가 없습니다.'); return true; }
    const current = state().pageId;
    const article = byId('article');
    if (article && article.parentElement) {
      state().readerPositions = state().readerPositions || {};
      state().readerPositions[targetKey()] = article.parentElement.scrollTop;
    }
    HR.openDoc(doc.id, version.id || versionId || state().versionId, pageId);
    if (current !== pageId && state().questionDraft.captured && state().questionDraft.text) HR.toast('작성 중인 질문은 원래 페이지에 연결되어 있습니다.');
    return true;
  }

  function showConflict(draft) {
    draft.conflict = { serverText: '다른 기기의 메모 예시: 결과를 반영하기 직전에 generation을 다시 확인할 것.', localText: draft.text };
    state().readerConflictKey = targetKey(draft.target);
    HR.openDialog('다른 기기에서 메모가 바뀌었습니다',
      '<p>내 초안은 그대로 보관되어 있습니다. 현재 메모를 불러오거나, 두 내용을 확인하여 직접 병합해 주세요.</p>' +
      '<h3>현재 메모</h3><blockquote>' + esc(draft.conflict.serverText) + '</blockquote>' +
      '<label for="readerMergeText">저장할 병합 내용</label><textarea id="readerMergeText" rows="6">' + esc(draft.text) + '</textarea>',
      '<button type="button" class="button secondary" data-action="note:reload">현재 메모 불러오기</button>' +
      '<button type="button" class="button primary" data-action="note:merge">병합 내용 저장</button>');
  }

  function saveNote() {
    const draft = noteDraft();
    if (!connected()) { liveMessage('저장되지 않음 · 다시 연결한 뒤 저장해 주세요. 초안은 유지됩니다.', 'note'); return true; }
    if (/conflict/.test(state().scenario || '') && !draft.conflictResolved) { showConflict(draft); return true; }
    const key = targetKey(draft.target);
    state().savedNotes[key] = { text: draft.text, target: Object.assign({}, draft.target), savedAt: '시안에 저장됨' };
    draft.baseline = draft.text;
    draft.dirty = false;
    paintNote();
    HR.toast('이 버전과 페이지에 메모를 저장했습니다.');
    return true;
  }

  function sendQuestion() {
    const draft = questionDraft(true);
    const question = (draft.text || '').trim();
    if (!connected() || !providerAvailable()) { paintQuestion(); return true; }
    if (!question) {
      liveMessage('질문을 입력해 주세요.');
      const input = byId('questionInput');
      if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); }
      return true;
    }
    const captured = Object.assign({}, draft.captured);
    const answer = {
      id: 'reader-question-' + (++questionSequence), targetKey: targetKey(captured), captured,
      question, quote: draft.quote, mode: draft.mode, status: 'pending', text: '', limitation: ''
    };
    draft.answers.push(answer);
    draft.text = '';
    draft.needsNewCapture = true;
    draft.notice = '질문을 시안에 기록했습니다. 답변 예시를 준비합니다.';
    const input = byId('questionInput');
    if (input) { input.value = ''; input.removeAttribute('aria-invalid'); }
    paintQuestion();
    const unavailable = sourceUnavailable(captured);
    setTimeout(() => {
      answer.status = unavailable ? 'partial' : 'completed';
      answer.text = unavailable
        ? '저장된 설명은 계속 읽을 수 있습니다. 다만 요청한 소스가 준비되지 않아 현재 코드에서도 같은 조건이 성립하는지는 확인할 수 없습니다.'
        : '이 예제에서는 결과를 반영하는 시점에 실행의 generation과 현재 소유자를 다시 확인합니다. 이전 실행이 만든 결과라면 반영하지 않고, 현재 실행의 결과만 받아들입니다. 선택한 설명과 함께 이 경계를 확인해 보세요.';
      answer.limitation = unavailable ? '부분 답변 예시 · 소스 확인 불가. 문서 내용만으로 현재 코드의 동작을 검증했다고 표시하지 않습니다.' : '시안용 답변 예시입니다. 실제 AI나 소스 저장소에 요청하지 않았습니다.';
      if (draft.captured && targetKey(draft.captured) === answer.targetKey && !draft.text) draft.notice = '답변이 이 질문의 버전과 페이지에 연결되어 남았습니다.';
      if (state().route === 'reader' && state().context === 'ask') { paintQuestion(); }
    }, 450);
    return true;
  }

  function showCitation(button) {
    const draft = questionDraft(false);
    const answer = button && button.dataset.answer ? draft.answers.find(item => item.id === button.dataset.answer) : null;
    const target = answer ? answer.captured : currentTarget();

    HR.openDialog('질문의 문맥과 근거',
      '<p class="muted">' + esc(targetLabel(target)) + '</p><h3>질문할 때 선택한 설명</h3><blockquote class="reader-preserve">' + esc(quote) + '</blockquote>' +
      '<p>이 문맥은 질문을 보낼 때 고정되었습니다. 다른 페이지로 이동해도 바뀌지 않습니다.</p>' +
      '<p class="notice">시안에서는 저장된 설명의 위치를 보여줍니다. 소스 코드의 의미까지 검증한 결과로 표시하지 않습니다.</p>',
      '<button type="button" class="button primary" data-action="citation:open" data-doc="' + esc(target.docId) + '" data-version="' + esc(target.versionId) + '" data-page="' + esc(target.pageId) + '">이 설명 위치 열기</button>');

  function showMore() {
    const target = currentTarget();
    HR.openDialog('문서 메뉴', '<p>' + esc(targetLabel(target)) + '</p>' +
      '<div class="reader-menu stack"><button type="button" class="button secondary" data-action="dialog:importVersion">새 버전 가져오기</button>' +
      '<button type="button" class="button secondary" data-action="dialog:reference">페이지 위치 복사</button>' +
      '<button type="button" class="button secondary" data-action="dialog:attachment">원본 파일 안내</button>' +
      '<button type="button" class="button secondary" data-action="lifecycle:archive:' + esc(target.docId) + '">문서 보관하기</button>' +
      '<button type="button" class="button danger" data-action="lifecycle:trash:' + esc(target.docId) + '">문서 휴지통으로 이동</button></div>');

  }

  function showReference() {
    const target = currentTarget();
    const reference = '#doc=' + encodeURIComponent(target.docId) + '&version=' + encodeURIComponent(target.versionId) + '&page=' + encodeURIComponent(target.pageId);
    HR.openDialog('페이지 위치 복사',
      '<p>' + esc(targetLabel(target)) + '</p><label class="field" for="readerReference">이 시안의 문서 위치</label>' +
      '<input id="readerReference" type="text" readonly value="' + esc(reference) + '">' +
      '<p class="small muted">필드의 내용을 직접 복사할 수 있습니다. 문서·버전·페이지를 식별하는 시안용 표기이며, 외부 기기에서 열리는 공유 링크가 준비되었다는 뜻은 아닙니다.</p>');
    const field = byId('readerReference');
    if (field) { field.focus(); field.select(); }
    return true;
  }

  function showAttachment(button) {
    const name = button && (button.dataset.path || button.dataset.file) || 'attachments/retry-trace.txt';
    HR.openDialog('첨부 파일', '<p><strong>' + esc(name) + '</strong></p><p>미리 볼 수 없는 형식도 원래 경로와 함께 보관됩니다.</p>' +
      '<p class="notice">이 시안에는 다운로드할 실제 원본 파일이 포함되어 있지 않습니다. 실제 제품에서는 선택한 원본 파일을 내려받는 위치입니다.</p>');
    return true;
  }

  function showReattach(button) {
    const doc = HR.doc();
    const destinationVersion = state().route === 'versions' && doc.versions[state().compareNew] ? state().compareNew : state().versionId;
    const version = doc.versions[destinationVersion];
    const oldVersion = state().route === 'versions' && doc.versions[state().compareOld] ? state().compareOld : doc.versions.v2 ? 'v2' : state().versionId;
    const origin = { docId: doc.id, versionId: oldVersion, pageId: 'flow', title: doc.title, path: '이전 버전의 재시도 설명' };
    const originKey = button && button.dataset.noteKey || targetKey(origin);
    const section = button && button.closest('.section');
    const copy = section && Array.from(section.querySelectorAll('p')).map(node => node.textContent).find(text => text.includes('메모 본문:'));
    const sampleText = copy ? copy.split('메모 본문:').slice(1).join('메모 본문:').trim() : '이전 버전에서 확인한 재시도 조건을 현재 설명과 다시 비교할 것.';
    state().readerReattach = { origin, originKey, versionId: destinationVersion, pageId: state().pageId, text: savedText(state().savedNotes[originKey]) || sampleText };
    HR.openDialog('메모를 현재 버전에 다시 연결',
      '<p>이전 버전의 위치 기록을 남기고, 직접 고른 페이지에 메모를 연결합니다. 비슷한 제목만으로 자동 이동하지 않습니다.</p>' +
      '<blockquote>' + esc(state().readerReattach.text) + '</blockquote>' +
      '<label for="reattachPage">연결할 페이지</label><select id="reattachPage">' +
      Object.entries(version.pages).map(([id, page]) => '<option value="' + esc(id) + '"' + (id === state().pageId ? ' selected' : '') + '>' + esc(page.path) + '</option>').join('') + '</select>',
      '<button type="button" class="button primary" data-action="note:reattach">선택한 페이지에 연결</button>');
    return true;
  }

  HR.renderReaderContext = function () {
    const context = state().context;
    if (!contextNames.has(context)) return '';
    const wrapper = document.createElement('div');
    wrapper.innerHTML = HR.fragments[context] || '';
    Array.from(wrapper.children).filter(node => node.classList.contains('context-head')).forEach(node => node.remove());
    const body = Array.from(wrapper.children).find(node => node.classList.contains('context-body'));
    if (body) body.classList.remove('context-body');
    return wrapper.innerHTML;
  };

  HR.afterReaderRender = function () {
    if (state().route !== 'reader') return;
    const doc = HR.doc();
    const version = HR.version();
    const page = version && version.pages[state().pageId];
    if (!doc || !version || !page) return;
    const title = byId('readerTitle') || document.querySelector('#screen h1');
    if (title) title.textContent = doc.title;
    const projectLabel = document.querySelector('#screen .page-header .eyebrow');
    if (projectLabel) projectLabel.textContent = doc.project === 'podway' ? 'Podway' : doc.project === 'haeryong' ? 'Haeryong' : doc.project;
    const date = document.querySelector('#screen .page-header time');
    if (date && version.date) {
      date.textContent = '버전 생성 ' + version.date.slice(0, 10);
      date.dateTime = version.date.slice(0, 10);
      date.title = '선택한 버전의 생성 시각: ' + version.date;
    }
    const freshness = { current: '원본과 일치', changed: '원본 변경됨', unknown: '원본 정보 없음' };
    setText('freshnessState', sourceUnavailable(currentTarget()) ? '원본 정보 없음 또는 사용 불가' : state().scenario === 'partial' ? '일부 범위 확인' : freshness[doc.freshness] || '원본 확인 전');
    const freshnessBadge = byId('freshnessState');
    if (freshnessBadge) freshnessBadge.dataset.state = sourceUnavailable(currentTarget()) ? 'unknown' : state().scenario === 'partial' ? 'partial' : doc.freshness || 'unknown';
    actions('context:notes').forEach(button => { button.textContent = '메모'; });
    const moreMenu = document.querySelector('#screen .more-menu');
    if (moreMenu && !moreMenu.querySelector('[data-action="dialog:reference"]')) {
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'button ghost';
      copy.dataset.action = 'dialog:reference';
      copy.textContent = '페이지 위치 복사';
      moreMenu.appendChild(copy);
    }
    setText('readerPath', page.path);
    setText('pagePath', page.path);
    const versionSelect = byId('versionSelect');
    if (versionSelect) {
      versionSelect.innerHTML = Object.keys(doc.versions).slice().reverse().map(id => '<option value="' + esc(id) + '">' + esc(id) + (id === Object.keys(doc.versions).slice(-1)[0] ? ' · 최신 버전' : '') + '</option>').join('');
      versionSelect.value = state().versionId;
      versionSelect.title = versionSelect.selectedOptions[0]?.textContent || state().versionId;
    }
    const pageSelect = byId('pageSelect');
    if (pageSelect) {
      pageSelect.innerHTML = Object.entries(version.pages).map(([id, item]) => '<option value="' + esc(id) + '">' + esc(item.title || item.path) + '</option>').join('');
      pageSelect.value = state().pageId;
      pageSelect.title = page.title || page.path;
    }
    const article = byId('article');
    if (article && article.dataset.targetKey !== targetKey()) {
      if (page.html) article.innerHTML = page.html;
      article.dataset.targetKey = targetKey();
      const position = (state().readerPositions || {})[targetKey()];
      if (position != null && article.parentElement) article.parentElement.scrollTop = position;
    }
    document.querySelectorAll('[data-action^="page:"]').forEach(button => {
      const id = button.dataset.action.slice(5);
      if (version.pages[id]) {
        button.setAttribute('aria-current', id === state().pageId ? 'page' : 'false');
        if (state().context === 'files') {
          button.setAttribute('aria-label', version.pages[id].path);
          const row = button.closest('.list-row');
          const path = row && row.querySelector('.row-title');
          const metadata = row && row.querySelector('.row-meta');
          if (path) path.textContent = version.pages[id].path;
          if (metadata) metadata.textContent = version.pages[id].title;
        }
      }
    });
    paintReview();
    paintNote();
    paintQuestion();
    paintEvidence();
    paintLinkDecision();
    paintSimulation();
  };

  HR.readerInput = function (id, value) {
    if (id === 'noteInput') {
      const draft = noteDraft();
      draft.text = value;
      draft.dirty = value !== draft.baseline;
      paintNote();
      return true;
    }
    if (id === 'questionInput') {
      const draft = questionDraft(true);
      draft.text = value;
      if (draft.needsNewCapture && value) {
        const explicitMode = draft.nextMode;
        draft.captured = null;
        draft.quote = '';
        draft.needsNewCapture = false;
        questionDraft(true);
        if (explicitMode) draft.mode = explicitMode;
        delete draft.nextMode;
        paintQuestion();
      }
      draft.notice = '질문 초안이 유지됩니다.';
      const input = byId('questionInput');
      if (input) input.removeAttribute('aria-invalid');
      return true;
    }
    if (id === 'readerMergeText') {
      const draft = state().noteDrafts[state().readerConflictKey];
      if (draft) draft.mergeText = value;
      return true;
    }
    return false;
  };

  HR.readerChange = function (id, value) {
    if (id === 'pageSelect') return openPage(value);
    if (id === 'versionSelect') {
      const doc = HR.doc();
      const version = doc && doc.versions[value];
      if (!version) return true;
      return openPage(version.pages[state().pageId] ? state().pageId : Object.keys(version.pages)[0], value);
    }
    if (id === 'askMode') {
      const draft = questionDraft(true);
      draft.mode = value === 'current' ? 'current' : 'snapshot';
      if (draft.needsNewCapture) draft.nextMode = draft.mode;
      return true;
    }
    if (id === 'reattachPage') {
      if (state().readerReattach) state().readerReattach.pageId = value;
      return true;
    }
    return false;
  };

  HR.readerAction = function (action, button) {
    if (action === 'context:close') return closeContext();
    if (action.startsWith('context:')) return openContext(action.slice(8), button);
    if (action.startsWith('page:')) return openPage(action.slice(5));
    if (action === 'review') {
      if (!connected()) { HR.toast('다시 연결한 뒤 검토 상태를 저장해 주세요.'); return true; }
      const version = HR.version();
      version.review = version.review === 'reviewed' ? 'reviewing' : 'reviewed';
      paintReview();
      HR.toast(version.review === 'reviewed' ? '이 버전 전체를 검토 완료로 표시했습니다. 소스 확인 상태와는 별개입니다.' : '이 버전을 다시 검토 중으로 표시했습니다.');
      return true;
    }
    if (action === 'revisit') {
      if (!connected()) { HR.toast('다시 연결한 뒤 저장해 주세요.'); return true; }
      state().revisit = state().revisit || [];
      const index = state().revisit.indexOf(state().docId);
      if (index === -1) state().revisit.push(state().docId); else state().revisit.splice(index, 1);
      paintReview();
      HR.toast(index === -1 ? '다시 볼 문서에 추가했습니다.' : '다시 볼 문서에서 해제했습니다.');
      return true;
    }
    if (action === 'simulate') {
      state().readerSimulation = state().readerSimulation || {};
      state().readerSimulation[targetKey()] = ((state().readerSimulation[targetKey()] || 0) + 1) % 4;
      paintSimulation();
      return true;
    }
    if (action === 'ask:retarget') {
      const draft = questionDraft(true);
      draft.captured = currentTarget();
      draft.quote = selectedArticleText() || excerptFor(draft.captured);
      draft.needsNewCapture = false;
      draft.notice = '질문 문맥을 현재 페이지로 바꿨습니다. 입력한 질문은 유지됩니다.';
      paintQuestion();
      return true;
    }
    if (action === 'ask:send') return sendQuestion();
    if (action === 'note:save') return saveNote();
    if (action === 'note:cancel') {
      const draft = noteDraft();
      draft.text = draft.baseline;
      draft.dirty = false;
      const input = byId('noteInput');
      if (input) input.value = draft.text;
      paintNote();
      HR.toast('저장된 메모로 되돌렸습니다.');
      return true;
    }
    if (action === 'note:reload' || action === 'note:merge') {
      const draft = state().noteDrafts[state().readerConflictKey];
      if (!draft || !draft.conflict) return true;
      const merged = byId('readerMergeText');
      draft.text = action === 'note:reload' ? draft.conflict.serverText : merged ? merged.value : (draft.mergeText || draft.text);
      draft.baseline = draft.text;
      draft.dirty = false;

      message: "", origin: fromFinding ? "finding" : "create"
    };
    const draft = s.draft;
    if (!fromFinding) {
      s.create.status = "running";
      s.create.progress = 0;
      s.create.draftId = draft.id;
      s.create.error = "";
    } else dialog("draft");
    run(draft, function () {
      draft.progress = Math.min(100, draft.progress + 20);
      if (draft.origin === "create" && s.create.draftId === draft.id) s.create.progress = draft.progress;
      if (draft.progress === 100) {
        stop(draft.id);
        draft.status = "ready";
        draft.message = "표본 초안이 준비되었습니다. 검토와 게시는 별도 행동입니다.";
        if (draft.origin === "create" && s.create.draftId === draft.id) s.create.status = "completed";
        H.toast("예시 초안이 준비되었습니다.");
      }
    });
    paint();
  }

  function draftStale(draft) {
    if (!draft.docId) return false;
    const doc = H.doc(draft.docId);
    return !alive(doc) || latestId(doc) !== draft.base ||
      (/^(stale|stale-draft|stale-base|version-conflict)$/.test(H.state.scenario || "") && !draft.rebased);
  }

  function publishDraft() {
    const draft = state().draft;
    if (draft.status !== "ready" || draft.resultId || blocked(false)) return;
    if (draftStale(draft)) {
      draft.message = "초안의 기준 " + draft.base + "이 현재 버전과 다릅니다. 초안은 게시하지 않았습니다.";
      draft.conflict = true;
      paint();
      return;
    }
    const doc = draft.docId ? H.doc(draft.docId) : newDocument(draft.title, draft.project);
    const versionId = outcomeVersion(doc, draft.body, draft.title);
    draft.status = "published";
    draft.resultId = doc.id;
    draft.resultVersionId = versionId;
    draft.history.push({ action: "publish", revision: draft.revision, versionId: versionId });
    draft.message = "예시 버전 " + versionId + "을 게시했습니다. 개인 검토는 미검토 상태입니다.";
    paint();
    H.toast("게시한 표본 결과를 열 수 있습니다.");
  }

  function replaceDraft() {
    const draft = state().draft;
    if (draft.status !== "ready" || blocked(false)) return;
    draft.revision += 1;
    draft.history.push({ action: "replace", revision: draft.revision, base: draft.base });
    draft.body = sampleBody(draft.title, (draft.request || "확인할 근거와 설명 순서") +
      " 표본 교체 파일 " + draft.revision + "을 적용했습니다. 선택한 기준 버전은 그대로입니다.");
    draft.message = "교체 표본을 적용했습니다. 초안 리비전 " + draft.revision +
      "을 다시 검토해 주세요. 아직 게시되지 않았습니다.";
    paint();
  }

  function beginScan() {
    const s = state();
    const scan = s.scan;
    if (scan.status === "running") return;
    ["scanScope", "scanDepth", "scanBudget"].forEach(function (id) {
      const el = H.$(id);
      if (el) managementChange(id, el.value, el);
    });
    if (blocked(scan.depth === "semantic")) return;
    const budget = Number(scan.budget);
    if (!Number.isFinite(budget) || budget < 1) {
      scan.error = "작업 예산에는 1 이상의 횟수를 입력해 주세요.";
      paint();
      return;
    }
    scan.id = "scan-" + (++sequence);
    scan.status = "running";
    scan.progress = 0;
    scan.error = "";
    scan.captured = { scope: scan.scope, depth: scan.depth, budget: scan.budget, project: s.projectId };
    scan.units = sampleUnits(scan.scope, scan.depth === "semantic");
    run(scan, function () {
      scan.progress = Math.min(100, scan.progress + 10);
      if (scan.progress === 100) {
        stop(scan.id);
        scan.status = "completed";
        scan.coverage = coverage(scan);
        const counts = scan.coverage;
        scan.history.unshift({
          id: scan.id, scope: { both: "프로젝트 2곳", yard: "Haeryong", harbor: "Podway" }[scan.captured.scope] || scan.captured.scope,
          status: scan.depth === "semantic" ? "일부 의미 검토 완료" : "구조 확인 완료",
          structural: counts.structural + "/" + counts.eligible, semantic: counts.assessed + "/" + counts.eligible,
          date: "2026-10-12"
        });
        H.toast("예시 정비가 끝났습니다. 미평가 자료를 포함한 범위를 확인해 주세요.");
      }
    });
    H.closeDialog();
    H.go("maintenance");
    paint();
  }

  function addPreviewContent(draft) {
    const marker = H.$("draftState");
    if (!marker) return;
    const body = H.$("dialogBody");
    let title = H.$("draftTitle") || (body && body.querySelector(".page-header h1"));
    let content = H.$("draftContent");
    if (!content) {
      content = body && body.querySelector("article.section");
      if (!content) {
        content = document.createElement("section");
        content.className = "card section";
        marker.insertAdjacentElement("afterend", content);
      }
      content.id = "draftContent";
    }
    if (title) title.textContent = draft.title;
    const key = draft.id + ":" + draft.revision;
    if (content.dataset.draftRevisionKey !== key) {
      content.innerHTML = draft.body;
      content.dataset.draftRevisionKey = key;
    }
    const original = body && body.querySelector("article.card:not(#draftContent)");
    if (original) {
      const heading = original.querySelector("h2");
      const desc = original.querySelector("p");
      if (heading) heading.textContent = draft.base ? "기준 " + draft.base : "새 문서로 게시";
      if (desc) desc.textContent = draft.docId ?
        ((H.doc(draft.docId) || {}).title || "원래 문서") + "의 표본 버전을 기준으로 준비한 내용입니다." :
        "아직 서재에 게시되지 않은 새 설명입니다.";
    }
    const publish = body && body.querySelector('[data-action="draft:publish"]');
    if (publish) publish.textContent = "검토한 초안 게시";
    const footer = body && body.querySelector("p.small.muted");
    if (footer) footer.textContent = "교체와 거절은 초안 기록에 남습니다. 별도로 게시해야 서재의 새 버전이 됩니다. " +
      (draft.history.length ? "이 초안의 기록: " + draft.history.map(function (item) {
        return ({ replace: "교체", reject: "거절", publish: "게시", rebase: "기준 변경" }[item.action] || item.action) +
          " r" + item.revision;
      }).join(" · ") : "아직 초안을 변경하지 않았습니다.");
  }

  function paintReports(s) {
    const report = H.$("reportBody");
    const counts = coverage(s.scan);
    const countText = "구조 " + counts.structural + "/" + counts.eligible +
      " · 의미 " + counts.assessed + "/" + counts.eligible +
      " · 미평가 " + counts.unchecked + " · 원본 없음 " + counts.unavailable;
    if (!report) return;
    if (report.dataset.managementRendered !== s.report) {
      report.innerHTML = normalized(H.fragments[s.report]);
      report.dataset.managementRendered = s.report;
    }
    const summaryHeader = report.parentElement && report.parentElement.querySelector("header .small");
    if (summaryHeader) summaryHeader.textContent = "선택한 표본 범위 · " + countText;
    const mainHeader = H.$("screen") && H.$("screen").querySelector(".page-header .muted");
    if (mainHeader) mainHeader.textContent = "Podway와 Haeryong의 설명을 점검하는 로컬 시안입니다. " +
      (s.scan.status === "idle" ? "아래에는 미리 준비한 표본 보고서를 표시합니다." : "이번 예시 실행의 범위를 표시합니다.");
    if (s.report === "coverage") {
      const intro = report.querySelector(".page-header .muted");
      if (intro) intro.textContent = countText + ". 원본을 확인하지 못한 항목도 전체 범위에 남깁니다.";
      const cards = report.querySelectorAll(".grid .card");
      if (cards[0]) {
        cards[0].querySelector(".row-title").textContent = counts.structural + "/" + counts.eligible;
        cards[0].querySelector(".muted").textContent = "선택한 페이지와 경로 확인";
      }
      if (cards[1]) {
        cards[1].querySelector(".row-title").textContent = counts.assessed + "/" + counts.eligible;
        cards[1].querySelector(".muted").textContent = "전체 선택 범위 중 평가한 페이지";
      }
      const table = report.querySelector("tbody");
      if (table) table.innerHTML = s.scan.units.map(function (unit) {
        return "<tr><td>" + H.escape(unit.title) + "<br><span class='small muted'>" + H.escape(unit.path) +
          "</span></td><td>" + H.escape(unit.project === "podway" ? "Podway" : "Haeryong") +
          "</td><td>확인됨</td><td>" + ({ assessed: "평가됨", unchecked: "미평가", unavailable: "원본 없음" }[unit.semantic]) + "</td></tr>";
      }).join("");
      const notice = report.querySelector(".notice");
      if (notice) notice.textContent = "평가하지 않은 " + counts.unchecked + "개와 원본을 확인하지 못한 " +
        counts.unavailable + "개도 전체 " + counts.eligible + "개에 포함됩니다. 구조 확인만으로 의미가 최신이라고 판단하지 않습니다.";
    }
    if (s.report === "freshness") {
      const rows = report.querySelectorAll(".list-row");
      const primary = H.doc(s.finding.target.docId);
      if (rows[0] && primary) {
        rows[0].querySelector(".row-title").textContent = primary.title;
        rows[0].querySelector(".row-meta").textContent = "기준 " + s.finding.target.versionId + " · 결과 반영 조건을 확인한 표본 발견";
        rows[0].querySelector(".small").textContent = "Podway · " + (labels[s.finding.decision] || s.finding.decision) +
          (s.finding.reassessed ? " · 현재 기준 재평가" : "");
      }
      if (rows[1]) {
        const unknown = H.doc("unknown");
        rows[1].querySelector(".row-title").textContent = unknown ? unknown.title : "원본을 모르는 설명";
        rows[1].querySelector(".row-meta").textContent = "원본 정보 없음 · 최신 여부를 추정하지 않음";
        rows[1].querySelector(".small").textContent = "저장된 HTML은 계속 읽을 수 있습니다.";
        const button = rows[1].querySelector("button");
        if (button) { button.dataset.action = "open:unknown"; button.textContent = "설명 읽기"; }
      }
    }
    if (s.report === "relationships") {
      const suggestions = Array.from(report.querySelectorAll(".list-row")).filter(function (row) {
        return !!row.querySelector('[data-action="finding:approve"]');
      });
      if (suggestions[0]) {
        suggestions[0].querySelector(".row-title").textContent = "재시도 설명 → 문서 버전과 개인 검토 기록";
        suggestions[0].querySelector(".row-meta").textContent = "현재 소유권과 버전 고정이라는 근거를 함께 참고 · " +
          (labels[s.finding.decision] || s.finding.decision);
      }
      if (suggestions[1]) {
        suggestions[1].querySelector(".row-title").textContent = "원본을 모르는 HTML → 추가 근거 필요";
        suggestions[1].querySelector(".row-meta").textContent = "근거가 부족한 예시입니다. 확인 전에는 연결을 제안하지 않습니다.";
        const controls = suggestions[1].querySelector(".row-end");
        if (controls) controls.textContent = "근거 부족";
      }
    }
    if (s.report === "drafts") {
      const list = report.querySelector(".list");
      if (list) list.innerHTML = "<article class='list-row'><div><p class='row-title'>" +
        H.escape(s.draft.title) + "</p><p class='row-meta'>" +
        H.escape((labels[s.draft.status] || s.draft.status) + " · 리비전 " + s.draft.revision +
          (s.draft.base ? " · 기준 " + s.draft.base : " · 새 문서")) +
        "</p></div><div class='row-end'><button class='button primary' type='button' data-action='dialog:draft'>초안과 이력 열기</button></div></article>";
    }
    if (s.report === "activity") {
      const items = s.finding.history.map(function (item) {
        return "발견 " + ({ approved: "승인", rejected: "거절", undo: "승인 취소", reassess: "재평가" }[item.action] || item.action) +
          " · 리비전 " + item.revision;
      }).concat(s.draft.history.map(function (item) {
        return "초안 " + ({ replace: "교체", reject: "거절", publish: "게시", rebase: "기준 재선택" }[item.action] || item.action) +
          " · 리비전 " + item.revision + (item.versionId ? " · " + item.versionId : "");
      })).concat(s.scan.history.map(function (item) { return item.status + " · " + item.scope + " · 의미 " + item.semantic; }));
      const heading = report.querySelector("h1");
      const description = report.querySelector(".page-header .muted");
      if (heading) heading.textContent = "이 시안의 활동 " + items.length + "건";
      if (description) description.textContent = "이번 탭에서 실행한 표본 동작입니다. 실제 서버의 기록이 아닙니다.";
      const list = report.querySelector(".list");
      if (list) list.innerHTML = items.length ? items.reverse().map(function (item) {
        return "<article class='list-row'><div><p class='row-title'>" + H.escape(item) +
          "</p><p class='row-meta'>로컬 시안 · 본문과 개인 검토 상태는 별도로 관리합니다.</p></div></article>";
      }).join("") : "<p class='empty'>아직 이 시안에서 실행한 정비 동작이 없습니다.</p>";
    }
    const screen = H.$("screen");
    if (screen && !H.$("scanHistory")) {
      Array.from(screen.querySelectorAll("section.section")).forEach(function (section) {
        const heading = section.querySelector("h2");
        const list = section.querySelector(".list");
        if (heading && heading.textContent.trim() === "검사 기록" && list) list.id = "scanHistory";
      });
    }
  }

  function paint() {
    const s = state();
    const u = s.upload;
    const scan = s.scan;
    const draft = s.draft;
    const f = s.finding;
    paintReports(s);
    const counts = coverage(scan);
    text("scanStatus", (labels[scan.status] || scan.status) +
      (scan.status === "running" ? " · " + scan.progress + "% · " +
        (scan.progress < 30 ? "자료 목록 확인" : scan.progress < 60 ? "구조 확인" : "일부 의미 검토") : "") +
      (scan.status === "completed" ? " · 구조 " + counts.structural + "/" + counts.eligible +
        ", 의미 " + counts.assessed + "/" + counts.eligible + " · 미평가 " + counts.unchecked + ", 원본 없음 " + counts.unavailable : "") +
      (scan.error ? " · " + scan.error : ""));
    value("scanScope", scan.scope);
    value("scanDepth", scan.depth);
    value("scanBudget", scan.budget);
    const budgetField = H.$("scanBudget");
    if (budgetField) {
      budgetField.removeAttribute("max");
      const body = H.$("dialogBody");
      const note = body && body.querySelector("p.small");
      if (note) note.textContent = "예산은 이번 의미 검토의 AI 호출 시도 횟수입니다. 문서의 크기나 선택한 자료의 개수 제한이 아닙니다. 구조 확인은 AI 없이 사용할 수 있습니다.";
    }
    disable("scan:start", scan.status === "running");
    const history = H.$("scanHistory") || H.$("activityHistory");
    if (history) history.innerHTML = scan.history.map(function (row) {
      return "<p>" + H.escape(row.date + " · " + row.scope + " · " + row.status +
        " · 구조 " + row.structural + ", 의미 " + row.semantic) + "</p>";
    }).join("") || "<p>아직 실행한 예시 정비가 없습니다.</p>";

    const fMessage = (isStaleFinding() ? "재평가 필요" : labels[f.decision] || f.decision) +
      " · 리비전 " + f.revision + (f.message ? " · " + f.message : "");
    summary("findingDecision", fMessage);
    text("findingStatus", fMessage);
    const findingRoot = H.$("findingDecision") && H.$("dialogBody");
    if (findingRoot) {
      const doc = H.doc(f.target.docId);
      const heading = findingRoot.querySelector(".page-header h1");
      if (heading) heading.textContent = doc ? doc.title : "원래 대상 문서";
      const description = findingRoot.querySelector(".page-header .muted");
      if (description) description.textContent = "Podway · 선택한 설명과 근거에 대한 표본 발견";
      const evidence = findingRoot.querySelector("article.card p");
      if (evidence) evidence.textContent = "작성 당시 설명은 결과가 도착하면 저장하는 흐름을 사용합니다. 비교한 표본은 결과를 저장하기 직전에 현재 소유권을 확인합니다.";
      const target = findingRoot.querySelector(".code");
      if (target) target.textContent = "기준 " + f.target.versionId + " · 실행기/재시도/흐름.html · 디자인 검토용 근거";
      const overlay = findingRoot.querySelector("article.section");
      if (overlay) {
        const paragraphs = overlay.querySelectorAll("p");
        if (paragraphs[0]) paragraphs[0].textContent = "주제: 재시도와 결과 반영. 관찰한 근거를 바탕으로 다시 확인할 부분을 표시합니다.";
        if (paragraphs[1]) paragraphs[1].textContent = "문서 버전과 개인 검토 기록을 함께 참고하도록 제안합니다. 승인해도 원본 HTML을 게시하지 않습니다.";
      }
      const limit = findingRoot.querySelector("p.notice");
      if (limit) limit.textContent = "한계: 전체 " + counts.eligible + "개 표본 페이지 중 의미 " + counts.assessed +
        "개를 평가했습니다. 미평가와 원본 없음은 그대로 남깁니다. 승인은 원본 게시나 개인 검토 완료가 아닙니다.";
    }
    disable("finding:approve", isStaleFinding() || f.decision === "approved");
    disable("finding:undo", !f.overlayActive);

    let draftMessage = (labels[draft.status] || draft.status) + " · " + draft.title +
      " · 리비전 " + draft.revision + (draft.base ? " · 기준 " + draft.base : " · 새 문서");
    if (draft.status === "preparing") draftMessage += " · " + (draft.progress || 0) + "%";
    if (draft.status === "ready" && draftStale(draft)) draftMessage += " · 기준이 달라져 게시할 수 없습니다.";
    if (draft.message) draftMessage += " · " + draft.message;
    const draftActions = [];
    if (draft.status === "published") draftActions.push({ action: "draft:open", label: "게시한 결과 열기" });
    if (draft.status === "ready" && (draft.conflict || draftStale(draft))) draftActions.push({ action: "draft:rebase", label: "현재 버전을 기준으로 다시 검토" });
    status("draftState", draftMessage, draftActions);
    text("draftSummary", draftMessage);
    addPreviewContent(draft);
    disable("draft:replace", draft.status !== "ready");
    disable("draft:publish", draft.status !== "ready" || draftStale(draft));
    disable("draft:reject", !["ready", "preparing"].includes(draft.status));

    value("importKind", u.kind === "version" ? "newversion" : "newdoc");
    value("importTitle", u.title);
    value("importSample", u.sample);
    const baseSelect = H.$("importBase");
    if (baseSelect && baseSelect.tagName === "SELECT") {
      const doc = H.doc(u.docId);
      Object.keys((doc && doc.versions) || {}).forEach(function (id) {
        if (!Array.from(baseSelect.options).some(function (option) { return option.value === id; })) {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = id;
          baseSelect.appendChild(option);
        }
      });
    }
    value("importBase", u.base);
    ["importKind", "importTitle", "importBase", "importSample"].forEach(function (id) {
      const el = H.$(id);
      if (el) el.disabled = !!u.snapshot || u.status === "completed" || u.status === "abandoned";
    });
    progress("importProgress", u.progress || 0);
    const captured = u.snapshot;
    const targetDoc = H.doc(captured ? captured.docId : u.docId);
    const targetLabel = (captured ? captured.kind : u.kind) === "version" ?
      "문서 " + (targetDoc ? targetDoc.title : "사용할 수 없음") + " · 기준 " + (captured ? captured.base : u.base) :
      "새 문서";
    const uploadMessage = (labels[u.status] || u.status) + " · " + targetLabel +
      " · " + (u.progress || 0) + "%" + (u.error ? " · " + u.error : "") +
      (u.status === "completed" ? " · 결과가 서재에 반영되었습니다." : "");
    status("importStatus", uploadMessage, u.status === "conflict" && alive(targetDoc) ?
      [{ action: "upload:rebase", label: "현재 기준을 확인하고 선택" }] : []);
    text("uploadSummaryText", (u.title || "가져오기") + " · " + uploadMessage +
      " · 이 값은 실제 전송량이 아닌 디자인 시안의 진행 예시입니다.");
    if (H.syncUploadSummary) H.syncUploadSummary();
    disable("upload:start", !["idle", "failed"].includes(u.status));

  function managementAction(action) {
    const s = state();
    if (action.indexOf("report:") === 0) {

      s.report = report;
      redraw();
      return true;
    }
    switch (action) {
      case "dialog:scan": dialog("scan"); break;
      case "dialog:finding": dialog("finding"); break;
      case "dialog:draft": dialog("draft"); break;
      case "dialog:import": openImport(false); break;
      case "dialog:importVersion": openImport(true); break;
      case "dialog:create": dialog("create"); break;
      case "finding:approve": decideFinding("approved"); break;
      case "finding:reject": decideFinding("rejected"); break;
      case "finding:undo":
        if (s.finding.overlayActive && !blocked(false)) {
          s.finding.overlayActive = false;
          s.finding.decision = "pending";
          s.finding.history.push({ action: "undo", revision: ++s.finding.revision });
          s.finding.message = "적용한 메타데이터만 되돌렸습니다. 원본과 개인 검토는 바뀌지 않았습니다.";
          paint();
        }
        break;
      case "finding:reassess":
        if (!blocked(true)) {
          const doc = H.doc(s.finding.target.docId);
          if (!alive(doc)) { H.toast("원래 대상 문서를 사용할 수 없습니다."); break; }
          s.finding.stale = false;
          s.finding.reassessed = true;
          s.finding.decision = "pending";
          s.finding.overlayActive = false;
          s.finding.target.versionId = latestId(doc);
          s.finding.history.push({ action: "reassess", revision: ++s.finding.revision });
          s.finding.message = "현재 기준에 대한 표본 재평가를 준비했습니다. 승인과 게시는 별도입니다.";
          paint();
        }
        break;
      case "draft:create": prepareDraft(true); break;
      case "draft:replace": replaceDraft(); break;
      case "draft:reject":
        if (["ready", "preparing"].includes(s.draft.status) && !blocked(false)) {
          stop(s.draft.id);
          s.draft.status = "rejected";
          s.draft.history.push({ action: "reject", revision: s.draft.revision });
          s.draft.message = "초안을 거절했습니다. 게시한 원본은 바뀌지 않았습니다.";
          if (s.create.draftId === s.draft.id) s.create.status = "rejected";
          paint();
        }
        break;
      case "draft:publish": publishDraft(); break;
      case "draft:rebase":
        if (s.draft.status === "ready" && (s.draft.conflict || draftStale(s.draft)) && !blocked(false)) {
          const doc = H.doc(s.draft.docId);
          if (!alive(doc)) { H.toast("원래 대상 문서를 사용할 수 없습니다."); break; }
          s.draft.base = latestId(doc);
          s.draft.rebased = true;
          s.draft.conflict = false;
          s.draft.history.push({ action: "rebase", revision: ++s.draft.revision, base: s.draft.base });
          s.draft.message = "현재 기준을 명시적으로 선택했습니다. 이 초안을 다시 읽은 뒤 게시해 주세요.";
          paint();
        }
        break;
      case "draft:open":
        if (s.draft.resultId) { H.closeDialog(); H.openDoc(s.draft.resultId, s.draft.resultVersionId, "index"); }
        break;
      case "scan:start": beginScan(); break;
      case "scan:open": H.closeDialog(); s.report = "coverage"; H.go("maintenance"); break;
      case "upload:start": startUpload(); break;
      case "upload:pause":
        if (s.upload.status === "running") { stop(s.upload.id); s.upload.status = "paused"; paint(); }
        break;
      case "upload:resume": resumeUpload(); break;
      case "upload:rebase": rebaseUpload(); break;
      case "upload:open":
        if (s.upload.status === "completed" && s.upload.resultId) {
          H.closeDialog();
          H.openDoc(s.upload.resultId, s.upload.resultVersionId, "index");
        }
        break;
      case "upload:abandon":
        if (!["idle", "completed", "abandoned"].includes(s.upload.status)) {
          stop(s.upload.id);
          s.upload.status = "abandoned";
          s.upload.error = "이 표본 업로드를 명시적으로 중단했습니다. 게시된 문서를 삭제한 것은 아닙니다.";
          s.upload.history.push({ id: s.upload.id, status: "abandoned", title: s.upload.title });
          paint();
        }
        break;
      case "create:start": prepareDraft(false); break;
      case "create:open":
        if (s.create.draftId && s.create.draftId === s.draft.id) dialog("draft");
        else H.toast("이 생성 요청의 초안이 아직 준비되지 않았습니다.");
        break;
      default: return false;
    }
    return true;
  }

  function managementChange(id, next) {
    const s = state();
    const uploadFields = { importKind: "kind", importTitle: "title", importBase: "base", importSample: "sample" };
    if (uploadFields[id]) {
      if (!s.upload.snapshot && !["completed", "abandoned"].includes(s.upload.status)) {
        s.upload[uploadFields[id]] = id === "importKind" ?
          (next === "newversion" || next === "version" ? "version" : "new") : String(next);
        s.upload.error = "";
      }
      return true;
    }
    const scanFields = { scanScope: "scope", scanDepth: "depth", scanBudget: "budget" };
    if (scanFields[id]) {
      if (s.scan.status !== "running") s.scan[scanFields[id]] = String(next);
      return true;
    }
    if (id === "createTitle" || id === "createRequest") {
      s.create[id === "createTitle" ? "title" : "request"] = String(next);
      s.create.error = "";
      return true;
    }
    return false;
  }

  H.managementAction = managementAction;
  H.managementInput = managementChange;
  H.managementChange = managementChange;
  H.afterManagementRender = paint;

}());

    if (node) {
      node.setAttribute("role", "status");
      node.setAttribute("aria-live", "polite");
      node.className = "notice" + (["rejected", "expired"].includes(p.status) ? " warn" : "");
    }
  }

  function pairRequest() {
    const s = ensure();
    capturePairTarget();
    s.pair.sequence += 1;
    s.pair.code = String(482 + (s.pair.sequence % 100)) + " " + String(916 - (s.pair.sequence % 100));
    s.pair.status = "waiting";
    pairStatus();
    H.toast("새 비교 코드로 연결을 요청한 시안이에요.");
  }

  function pairApprove() {
    const s = ensure();
    capturePairTarget();
    if (["expired", "rejected"].includes(s.pair.status)) { H.toast("새 비교 코드로 먼저 다시 요청해 주세요."); return; }
    s.pair.status = "approved";
    s.connectionStatus = "connected";
    if (["disconnected", "offline", "session", "session-expired", "revoked"].includes(s.scenario)) s.scenario = "normal";
    const id = "paired-preview-device";
    const prior = s.devices.find(device => device.id === id);
    const item = { id: id, name: "미리보기 장치", current: prior ? !!prior.current : !s.devices.some(device => device.current), temporary: !s.pair.remember };
    if (prior) Object.assign(prior, item);
    else s.devices.push(item);
    const target = copy(s.pair.returnTarget);
    s.pair.returnTarget = null;
    pairStatus();
    H.toast(s.pair.remember ? "시안 연결을 승인하고 장치를 기억했어요." : "이번 연결만 승인했어요. 시안에서만 유지돼요.");
    if (target && target.docId && H.doc(target.docId) && !["trashed", "purged"].includes(H.doc(target.docId).lifecycle)) {
      H.openDoc(target.docId, target.versionId, target.pageId);
    } else H.go("reader");
  }

  function syncUploadSummary() {
    const host = $("uploadSummary");
    if (!host) return;
    const u = ensure().upload || {};
    const status = u.status || "idle";
    const labels = { idle: "준비 전", running: "가져오는 중", uploading: "가져오는 중", paused: "일시 정지", interrupted: "연결 중단", ready: "준비 완료", conflict: "기준 버전 확인 필요", failed: "가져오기 중단", complete: "완료", completed: "완료", abandoned: "가져오기 취소됨" };
    const captured = u.snapshot || u;
    const target = captured.docId && H.doc(captured.docId);
    const versionImport = captured.kind === "version" || captured.kind === "newversion";
    const targetLabel = versionImport ? (target ? target.title : "선택 문서") + " · 새 버전 · 기준 " + captured.base : "새 문서";
    const button = (action, label, primary) => '<button type="button" class="button' + (primary ? ' primary' : '') + '" data-action="' + action + '">' + label + '</button>';
    let actions = "";
    if (status === "idle" || status === "abandoned") {
      host.innerHTML = '<p class="row-title">진행 중인 가져오기가 없어요</p><p id="uploadSummaryText" class="row-meta">선택한 문서와 새 버전의 진행 상황이 여기에 표시돼요.</p><div class="row">' + button("dialog:import", "가져오기", true) + '</div>';
      return;
    }
    if (status === "running" || status === "uploading") actions += button("upload:pause", "일시 정지");
    if (status === "paused" || status === "interrupted") actions += button("upload:resume", "이어서 가져오기", true);
    if (status === "conflict") actions += button("upload:rebase", "기준 버전 확인", true);
    if (status === "failed") actions += button("upload:start", "다시 시도", true);
    if (status === "completed" || status === "complete") actions += button("upload:open", "가져온 결과 열기", true);
    else actions += button("upload:abandon", "가져오기 취소");
    host.innerHTML = '<p class="row-title">' + esc(captured.title || u.title || "가져오기") + '</p>' +
      '<p id="uploadSummaryText" class="row-meta">' + esc(labels[status] || status) + ' · ' + esc(targetLabel) + ' · ' + esc(u.progress || 0) + '%</p>' +
      (u.error ? '<p class="notice">' + esc(u.error) + '</p>' : '') +
      '<progress max="100" value="' + Math.max(0, Math.min(100, Number(u.progress) || 0)) + '" aria-label="가져오기 시안 진행률"></progress>' +
      '<div class="row">' + actions + '</div><p class="small muted">이 진행 상황은 시안의 샘플 상태예요.</p>';
  }

  H.syncUploadSummary = syncUploadSummary;

  function syncSchedule() {

  H.settingsAction = function (action, button) {
    const s = ensure();
    if (action.startsWith("setting:")) {
      const section = action.slice(8);
      if (!["general", "connection", "sessions", "projects", "ai", "maintenance", "retention", "storage", "backup", "about"].includes(section)) return false;
      s.setting = section;
      H.render();
      return true;
    }
    switch (action) {
      case "settings:apply": {
        const proposed = copy(working());
        if (!validateSettings(proposed)) return true;
        if (proposed.retentionDays !== s.settings.retentionDays || proposed.autoPurge !== s.settings.autoPurge) retentionDialog();
        else commitSettings(proposed);
        return true;
      }
      case "dialog:retention": if (validateSettings(working())) retentionDialog(); return true;
      case "settings:confirmPolicy":
        if (s.settingsPending) { const next = copy(s.settingsPending); H.closeDialog(); commitSettings(next); }
        return true;
      case "settings:closeDialog": s.settingsPending = null; s.pendingSession = null; H.closeDialog(); return true;
      case "settings:cancel": s.settingsDraft = null; s.settingsPending = null; s.settingsDirty = false; feedback("적용 전 변경사항을 취소했어요."); H.render(); return true;
      case "connection:retry": connectionRetry(); return true;
      case "session:confirmRevoke": {
        const device = s.devices.find(item => item.id === s.pendingSession);
        if (!device) { H.closeDialog(); return true; }
        s.devices = s.devices.filter(item => item.id !== device.id);
        s.pendingSession = null;
        H.closeDialog();
        if (device.current) { s.pair.status = "expired"; s.connectionStatus = "disconnected"; s.pair.returnTarget = copy(H.target()); H.go("connect"); }
        else H.render();
        H.toast(device.name + "의 시안 연결을 해제했어요.");
        return true;
      }
      case "backup:create": createBackup(); return true;
      case "dialog:restoreBackup": restoreDialog(); return true;
      case "backup:trial": trialBackup(); return true;
      case "backup:simulateFailure": s.backup.attempt = "실패 · 시안"; s.backup.running = false; s.backup.job = (s.backup.job || 0) + 1; backupDetails(); H.toast("실패한 최근 시도와 마지막 성공을 구분해서 표시해요."); return true;
      case "pair:request": case "pair:retry": pairRequest(); return true;
      case "pair:approve": pairApprove(); return true;
      case "pair:reject": capturePairTarget(); s.pair.status = "rejected"; pairStatus(); return true;
      case "pair:expire": capturePairTarget(); s.pair.status = "expired"; pairStatus(); return true;
      default:
        if (action === "session:revoke" || action.startsWith("session:revoke:")) { revokeDialog(button, action); return true; }
        return false;
    }
  };

  function changeValue(id, value, target) {
    const s = ensure();
    if (id === "rememberDevice") {
      s.pair.remember = !!(target ? target.checked : value === true || value === "true");
      pairStatus();
      return true;
    }
    if (id === "themeChoice") {
      s.settings.themeChoice = value;
      if (s.settingsDraft) s.settingsDraft.themeChoice = value;
      s.theme = value === "dark" ? "dark" : value === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      applyAppearance();
      H.render();
      return true;
    }
    const key = ids[id];
    if (!key) return false;
    const next = target && target.type === "checkbox" ? target.checked : value;
    if (key === "fontSize" || key === "lineHeight") {
      const number = Number(next);
      if (!Number.isFinite(number) || number < (key === "fontSize" ? 14 : 1.3) || number > (key === "fontSize" ? 24 : 2.4)) return true;
      s.settings[key] = String(next);
      if (s.settingsDraft) s.settingsDraft[key] = String(next);
      applyAppearance();
      text(id + "Value", String(next) + (key === "fontSize" ? "px" : ""));
      feedback("읽기 모양을 시안에 바로 적용했어요.");
      return true;
    }
    setDraft(key, next);
    if (target) target.removeAttribute("aria-invalid");
    if (key === "retentionDays" || key === "autoPurge") policySummary();
    if (["scheduleMode", "scheduleInterval", "scheduleTime", "scheduleTimezone"].includes(key)) syncSchedule();
    return true;
  }

  H.settingsInput = function (id, value, target) {
    if (id === "themeChoice") return false;
    return changeValue(id, value, target);
  };

  H.settingsChange = function (id, value, target) { return changeValue(id, value, target); };

  H.afterSettingsRender = function () {
    const s = ensure();
    applyAppearance();
    normalizeSettingsCopy();
    const config = working();
    const sourceSelect = $("defaultSource");
    if (sourceSelect && sourceSelect.tagName === "SELECT" && !Array.from(sourceSelect.options).some(option => option.value === "snapshot")) {
      sourceSelect.innerHTML = '<option value="snapshot">저장된 설명 기준</option><option value="current">연결된 원본 함께 사용</option>';
    }
    Object.keys(ids).forEach(id => setControl(id, config[ids[id]]));
    setControl("themeChoice", s.theme || "light");
    text("fontSizeValue", s.settings.fontSize + "px");
    text("lineHeightValue", s.settings.lineHeight);
    policySummary();
    renderSessions();
    syncUploadSummary();
    syncSchedule();
    if (s.route === "settings" && s.setting === "connection" && !$("connectionStatus")) {
      const node = document.querySelector("#settingsBody .chip");
      if (node) node.id = "connectionStatus";
    }
    if (s.route === "settings" && s.setting === "ai" && !$("providerStatus")) {
      const node = document.querySelector("#settingsBody .chip");
      if (node) node.id = "providerStatus";
    }
    text("connectionStatus", s.connectionStatus === "checking" ? "연결 확인 중 · 시안" :
      ["disconnected", "offline"].includes(s.scenario) || s.connectionStatus === "disconnected" ? "연결 끊김 · 시안" : "연결됨 · 시안");
    if ($("connectionStatus")) $("connectionStatus").className = "chip" + (["disconnected", "offline"].includes(s.scenario) || s.connectionStatus === "disconnected" ? " warn" : s.connectionStatus === "checking" ? "" : " good");
    text("providerStatus", ["provider", "provider-unavailable", "no-provider"].includes(s.scenario) ? "사용 가능한 제공자가 없어요. 읽기와 메모는 계속 사용할 수 있어요." : "예시 제공자 · 실제 AI 요청은 보내지 않아요.");
    if ($("providerStatus")) $("providerStatus").className = "chip" + (["provider", "provider-unavailable", "no-provider"].includes(s.scenario) ? " warn" : "");
    if (s.route === "connect") {
      if (!s.pair.wasOnConnect) s.pair.returnTarget = copy(H.target());
      s.pair.wasOnConnect = true;
      capturePairTarget();
      pairStatus();
    } else s.pair.wasOnConnect = false;
    if (s.route === "settings" && s.setting === "backup") backupDetails();
    else if (s.route === "settings" && s.settingsFeedback) feedback(s.settingsFeedback);
    document.querySelectorAll('[data-action^="setting:"]').forEach(button => {
      const selected = button.dataset.action === "setting:" + s.setting;
      button.classList.toggle("active", selected);
      if (selected) button.setAttribute("aria-current", "page");
      else button.removeAttribute("aria-current");
    });

    }
    const changed = section ? changesFor(section, Object.assign({}, s.settings, c.drafts[section] || {})) : {};
    s.settingsDraft = Object.keys(changed).length ? Object.assign({}, s.settings, changed) : null;
    s.settingsDirty = !!s.settingsDraft;
    s.settingsFeedback = section ? c.feedback[section] || "" : "";
  }
  function setFeedback(section, message) {
    if (!section) return;
    context().feedback[section] = message || "";
    if (state().route === "settings" && state().setting === section) {
      state().settingsFeedback = message || "";
      renderFeedback(section);
    }
  }
  function renderFeedback(section) {
    const host = $("settingsBody");
    if (!host || state().route !== "settings") return;
    let node = $("settingsFeedback");
    if (!node) {
      node = document.createElement("p");
      node.id = "settingsFeedback";
      host.appendChild(node);
    }
    const message = context().feedback[section] || "";
    node.className = "hr-settings-feedback";
    node.setAttribute("role", "status");
    node.setAttribute("aria-live", "polite");
    node.textContent = message;
    node.hidden = !message;
  }
  function hide(node, hidden) {
    if (!node) return;
    node.hidden = hidden;
    if ("disabled" in node) node.disabled = hidden;
  }
  function focusId(id) {
    const node = id && $(id);
    if (node && node.focus) node.focus();
  }
  function pendingValues(section) {
    return Object.assign({}, state().settings, context().drafts[section] || {},
      state().route === "settings" && state().setting === section ? changesFor(section, state().settingsDraft || state().settings) : {});
  }
  function commitSection(section, values) {
    const s = state();
    for (const key of sectionKeys[section] || []) s.settings[key] = values[key];
    delete context().drafts[section];
    s.settingsDraft = null;
    s.settingsDirty = false;
    s.settingsPending = null;
    s.settingsPendingSection = null;
    setFeedback(section, labels[section] + "의 변경을 적용했어요.");
    H.render();
    H.toast(labels[section] + "의 변경을 시안에 적용했어요.");
  }
  function cancelSection(section) {
    delete context().drafts[section];
    state().settingsDraft = null;
    state().settingsDirty = false;
    state().settingsPending = null;
    state().settingsPendingSection = null;
    setFeedback(section, "이 항목의 적용 전 변경을 취소했어요.");
    H.render();
  }
  function decorateActions(host, section) {
    if (!sectionKeys[section]) return;
    const apply = host.querySelector('[data-action="' + (section === "retention" ? "dialog:retention" : "settings:apply") + '"]');
    if (!apply) return;
    let footer = host.querySelector(".hr-settings-actions");
    if (!footer) {
      footer = document.createElement("div");
      footer.className = "hr-settings-actions";
      apply.parentNode.insertBefore(footer, apply);
      footer.appendChild(apply);
    }
    let cancel = host.querySelector('[data-action="settings:cancel"]');
    if (!cancel) {
      cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "button";
      cancel.dataset.action = "settings:cancel";
      footer.appendChild(cancel);
    }
    cancel.textContent = "변경 취소";
    cancel.disabled = !state().settingsDirty;
    if (section !== "retention") {
      apply.textContent = "변경 적용";
      apply.disabled = !state().settingsDirty;
    }
  }
  function scheduleFields() {
    const mode = (state().settingsDraft || state().settings).scheduleMode;
    for (const id of ["intervalValue", "runTime", "timezone"]) {
      const control = $(id);
      if (!control) continue;
      const inactive = id === "intervalValue" ? mode !== "interval" : mode === "manual";
      control.disabled = inactive;
      hide(control.closest(".field"), inactive);
    }
    const interval = $("intervalValue");
    const grid = interval && interval.closest(".grid");
    if (grid) hide(grid, mode === "manual");
  }
  function decorateSettings() {
    const s = state(), host = $("settingsBody");
    if (s.route !== "settings" || !host) return;
    host.dataset.setting = s.setting;
    const eyebrow = host.querySelector(".page-header .eyebrow");
    if (eyebrow) eyebrow.hidden = true;
    for (const button of document.querySelectorAll('[data-action^="setting:"]')) {
      const key = button.dataset.action.slice(8);
      if (labels[key]) button.textContent = labels[key];
    }
    if (s.setting === "general") {
      const size = $("fontSize"), line = $("lineHeight");
      if (size) for (const o of size.options) o.textContent = o.value === "18" ? "크게 · 18px" : "기본 · 16px";
      if (line) for (const o of line.options) o.textContent = o.value === "1.9" ? "넉넉하게 · 1.9" : "보통 · 1.7";
    }
    if (s.setting === "connection") {
      const chip = $("connectionStatus"), form = host.querySelector("form");
      if (chip && form && chip.parentElement) {
        const row = chip.parentElement;
        row.classList.add("hr-connection-status");
        form.insertBefore(row, form.firstChild);
      }
      const reconnect = host.querySelector('[data-action="go:connect"]');
      if (reconnect) { reconnect.textContent = "다시 연결"; reconnect.classList.remove("primary"); }
      const addressHelp = host.querySelector(".field .small");
      if (addressHelp) addressHelp.textContent = "현재 연결 대상의 주소예요.";
      const repeated = form && form.querySelector("p.small");
      if (repeated && repeated.textContent.indexOf("연결 상태를 보여 주는 시안") >= 0) repeated.hidden = true;
    }
    if (s.setting === "sessions") {
      for (const row of host.querySelectorAll(".list-row")) {
        const action = row.querySelector('[data-action="session:revoke"]');
        const device = action && s.devices.find(d => d.id === action.dataset.sessionId);
        if (!device || !device.current) continue;
        const title = row.querySelector(".row-title");
        if (title && !title.querySelector(".chip")) {
          const badge = document.createElement("span");
          badge.className = "chip";
          badge.textContent = "현재 장치";
          title.appendChild(document.createTextNode(" "));
          title.appendChild(badge);
        }
      }
    }
    if (s.setting === "storage") {
      const repeated = host.querySelector(".section > .empty");
      if (repeated) repeated.hidden = true;
    }
    if (s.setting === "maintenance") scheduleFields();
    decorateActions(host, s.setting);
    renderFeedback(s.setting);
  }
  function decorateConnect() {
    const s = state();
    if (s.route !== "connect") return;
    const screen = $("screen"), p = s.pair || {};
    if (!screen) return;
    const phase = p.status || "idle";
    const phaseNode = $("connectPhase");
    if (phaseNode) phaseNode.dataset.phase = phase;
    const status = $("pairStatus");
    const messages = {
      idle: "연결 코드를 요청해 시작하세요.",
      waiting: "Mac에서 같은 코드를 확인하고 승인해 주세요.",
      approved: p.remember ? "연결 승인됨 · 이 장치를 기억해요." : "연결 승인됨 · 이번 연결에서만 사용해요.",
      connected: "연결되어 있어요. 읽던 문서로 돌아갈 수 있어요.",
      rejected: "연결 요청이 거절됐어요. Mac에서 확인한 뒤 새 코드를 요청하세요.",
      expired: "비교 코드가 만료됐어요. 새 코드를 요청해 주세요.",
      disconnected: "이 장치의 연결을 해제했어요. 다시 연결하려면 새 코드를 요청하세요."
    };
    if (status) {
      status.textContent = messages[phase] || messages.idle;
      status.className = "notice" + (["rejected", "expired", "disconnected"].includes(phase) ? " warn" : "");
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      const card = screen.querySelector("article.card");
      if (card) card.insertBefore(status, card.firstChild);
    }
    const code = $("pairCode");
    if (code) {
      code.textContent = p.code || "";
      hide(code.parentElement, !["waiting", "rejected", "expired"].includes(phase));
    }
    const request = screen.querySelector('[data-action="pair:request"]');
    const retry = screen.querySelector('[data-action="pair:retry"]');
    const reader = screen.querySelector('[data-action="go:reader"]');
    hide(request, !["idle", "disconnected", "waiting"].includes(phase));
    if (request) { request.textContent = phase === "waiting" ? "Mac의 승인 기다리는 중" : "연결 코드 요청"; request.disabled = phase === "waiting" || request.hidden; }
    hide(retry, !["rejected", "expired"].includes(phase));
    if (retry) retry.textContent = "새 코드 요청";
    hide(reader, !["approved", "connected"].includes(phase));
    if (reader) reader.textContent = "읽던 문서로 돌아가기";
    for (const action of ["pair:approve", "pair:reject", "pair:expire"]) {
      const button = screen.querySelector('[data-action="' + action + '"]');
      if (button) button.disabled = phase !== "waiting";
    }
    const remember = $("rememberDevice");
    if (remember) remember.disabled = ["waiting", "approved", "connected"].includes(phase);
    const label = screen.querySelector("article .row-title");
    if (label) label.textContent = "연결할 컴퓨터";
    const intro = screen.querySelector(".page-header .muted");
    if (intro) intro.textContent = "컴퓨터에서 비교 코드를 확인하고, 읽던 문서로 돌아오세요.";
    const card = screen.querySelector("article.card");
    if (card) for (const node of card.querySelectorAll("p")) {
      if (node.textContent.indexOf("로컬 확인 화면의 여섯 자리") >= 0) node.textContent = "Mac의 연결 요청 화면과 코드가 같은지 확인하세요. 코드는 Mac에서 승인합니다.";
    }
    for (const node of screen.querySelectorAll(".stack > p.small")) {
      if (node.textContent === "연결 상태 미리보기") node.hidden = true;
    }
  }
  H.afterSettingsRender = function () {
    const s = state(), next = s.route === "settings" ? s.setting : null;
    if (context().section !== next) activateSection(next);
    s.settingsFeedback = next ? context().feedback[next] || "" : "";
    previous.render();
    decorateSettings();
    decorateConnect();
  };
  function changed(previousHandler, id, value, target) {
    const section = state().route === "settings" ? state().setting : null;
    const handled = previousHandler(id, value, target);
    if (!handled) return handled;
    if (section) {
      rememberDraft(section);
      if (["themeChoice", "fontSize", "lineHeight"].includes(id)) setFeedback(section, "읽기 모양을 바로 반영했어요.");
      else setFeedback(section, state().settingsDirty ? "이 항목에 아직 적용하지 않은 변경이 있어요." : "현재 설정과 같아요.");
      decorateSettings();
      if (id === "themeChoice") focusId(id);
    }
    if (state().route === "connect") decorateConnect();
    return handled;
  }
  H.settingsInput = (id, value, target) => changed(previous.input, id, value, target);
  H.settingsChange = (id, value, target) => changed(previous.change, id, value, target);
  H.settingsAction = function (action, button) {
    const s = state(), section = s.setting;
    if (action.startsWith("setting:") && labels[action.slice(8)]) {
      rememberDraft(context().section);
      s.setting = action.slice(8);
      activateSection(s.setting);
      H.render();
      return true;
    }
    if (action === "settings:cancel") { cancelSection(section); return true; }
    if (action === "settings:apply" && sectionKeys[section] && section !== "retention") {
      rememberDraft(section);
      commitSection(section, pendingValues(section));
      return true;
    }
    if (action === "dialog:retention" || (action === "settings:apply" && section === "retention")) {
      rememberDraft("retention");
      s.settingsDraft = pendingValues("retention");
      s.settingsPending = null;
      s.settingsPendingSection = null;
      const result = previous.action("dialog:retention", button);
      if (s.settingsPending) s.settingsPendingSection = "retention";
      else setFeedback("retention", s.settingsFeedback || "보존 일수를 확인해 주세요.");
      const dialog = $("appDialog");
      if (dialog && s.settingsPending) dialog.dataset.settingsDialog = "retention";
      return result;
    }
    if (action === "settings:confirmPolicy" && s.settingsPendingSection === "retention" && s.settingsPending) {
      const values = clone(s.settingsPending);
      H.closeDialog();
      commitSection("retention", values);
      return true;
    }
    if (action === "pair:approve") {
      if (!s.pair || s.pair.status !== "waiting") { H.toast("먼저 새 연결 코드를 요청해 주세요."); return true; }
      s.pair.status = "approved";
      s.connectionStatus = "connected";
      if (["disconnected", "offline", "session", "session-expired", "revoked"].includes(s.scenario)) s.scenario = "normal";
      const id = "paired-preview-device", prior = s.devices.find(d => d.id === id);
      const item = { id, name: "미리보기 장치", current: prior ? !!prior.current : !s.devices.some(d => d.current), temporary: !s.pair.remember };
      if (prior) Object.assign(prior, item); else s.devices.push(item);
      H.render();
      H.toast("승인된 연결 상태를 시연했어요. 실제 장치 승인은 변경하지 않았어요.");
      return true;
    }
    if (["pair:reject", "pair:expire"].includes(action) && (!s.pair || s.pair.status !== "waiting")) {
      H.toast("코드를 요청한 뒤 결과를 시연해 주세요.");
      return true;
    }
    const currentRevoked = action === "session:confirmRevoke" && s.devices.some(d => d.id === s.pendingSession && d.current);
    const result = previous.action(action, button);
    if (!result) return result;
    if (currentRevoked) { s.pair.status = "disconnected"; s.pair.code = ""; H.render(); }
    if (action === "settings:closeDialog") s.settingsPendingSection = null;
    if (action === "connection:retry") setFeedback("connection", "");
    if (action.startsWith("backup:") || action === "dialog:restoreBackup") setFeedback("backup", "");
    decorateSettings();
    decorateConnect();
    return result;
  };
  H.coreAction = function (action, button) {
    const s = state();
    if (action === "go:reader" && s.route === "connect") {
      if (!s.pair || !["approved", "connected"].includes(s.pair.status)) { H.toast("연결 승인 결과를 먼저 확인해 주세요."); return true; }
      const target = s.pair.returnTarget;
      s.pair.returnTarget = null;
      s.pair.status = "connected";
      if (target && target.docId && H.doc(target.docId) && !["trashed", "purged"].includes(H.doc(target.docId).lifecycle)) H.openDoc(target.docId, target.versionId, target.pageId);
      else H.go("reader");
      return true;
    }
    if (action === "dialog:close" && s.settingsPendingSection) { s.settingsPending = null; s.settingsPendingSection = null; }
    return previous.core(action, button);
  };
  const policyDialog = $("appDialog");
  if (policyDialog && policyDialog.addEventListener) {
    const clearPolicyConfirmation = function () {
      const s = state();
      if (s.settingsPendingSection === "retention") {
        s.settingsPending = null;
        s.settingsPendingSection = null;
      }
      if (policyDialog.dataset.settingsDialog === "retention") delete policyDialog.dataset.settingsDialog;
    };
    policyDialog.addEventListener("cancel", function (event) {
      // Let every native cancel listener run before checking whether dismissal was prevented.
      // The original core listener continues to own focus restoration.
      Promise.resolve().then(function () {
        if (!event.defaultPrevented) clearPolicyConfirmation();
      });
    });
    policyDialog.addEventListener("close", clearPolicyConfirmation);
  }
})();


/* R5 auxiliary panel polish. The original Reader owns all state and actions. */
(function (H) {
  'use strict';
  if (!H || H.contextR5Installed) return;
  H.contextR5Installed = true;

  function paintFiles(body) {
    const version = H.version();
    if (!version || !version.pages) return;
    for (const button of body.querySelectorAll('[data-action^="page:"]')) {
      const page = version.pages[button.dataset.action.slice('page:'.length)];
      const row = button.closest('.list-row');
      if (!page || !row) continue;
      const title = row.querySelector('.row-title');
      const path = row.querySelector('.row-meta');
      if (title) title.textContent = page.title || page.path;
      if (path) path.textContent = page.path;
      // The title reset removes its old marker; also clear any previous sibling marker.
      row.querySelectorAll('.file-current').forEach(marker => marker.remove());
      if (title && button.getAttribute('aria-current') === 'page') {
        const marker = document.createElement('span');
        marker.className = 'file-current';
        marker.textContent = '현재 페이지';
        title.appendChild(document.createTextNode(' '));
        title.appendChild(marker);
      }
    }
  }

  function paintEvidence(body) {
    const documentItem = H.doc();
    const version = H.version();
    const page = version && version.pages[H.state.pageId];
    if (!documentItem || !page) return;
    const prefix = [documentItem.title, H.state.versionId, page.path].filter(Boolean).join(' · ') + ' · ';
    const status = H.$('readerEvidenceStatus');
    if (status && status.textContent.startsWith(prefix)) {
      status.textContent = status.textContent.slice(prefix.length);
    }
    const revision = body.querySelector('p.small.muted');
    const versionPrefix = H.state.versionId + ' · ';
    if (revision && revision.textContent.startsWith(versionPrefix)) {
      revision.textContent = revision.textContent.slice(versionPrefix.length);
    }
  }

  const originalAfterReaderRender = H.afterReaderRender;
  H.afterReaderRender = function () {
    const result = originalAfterReaderRender.apply(this, arguments);
    if (H.state.route !== 'reader') return result;
    const context = H.$('context');
    const body = context && context.querySelector('.context-body');
    if (!body) return result;
    if (H.state.context === 'files') paintFiles(body);
    if (H.state.context === 'evidence') paintEvidence(body);
    return result;
  };
})(window.HR);


/* R5: exception banners lead to the place where the user can act. */
(function (H) {
  'use strict';
  const destinations = {
    source: ['원본 범위 확인', 'source'],
    provider: ['질문 설정 확인', 'provider'],
    conflict: ['메모 확인', 'notes'],
    partial: ['확인 범위 보기', 'coverage'],
    stale: ['초안 검토', 'drafts']
  };
  const renderBanner = H.renderBanner;
  H.renderBanner = function () {
    const result = renderBanner.apply(this, arguments);
    const destination = destinations[H.state.scenario];
    const action = H.$('banner')?.querySelector('button');
    if (destination && action) {
      action.textContent = destination[0];
      action.dataset.action = 'recovery:' + destination[1];
    }
    return result;
  };

  const coreAction = H.coreAction;
  H.coreAction = function (action) {
    if (!action.startsWith('recovery:')) return coreAction.apply(this, arguments);
    const target = action.slice('recovery:'.length);
    if (target === 'source') {
      if (H.doc()?.project) H.state.projectId = H.doc().project;
      H.go('sources');
    } else if (target === 'provider') {
      H.state.setting = 'ai';
      H.go('settings');
    } else if (target === 'notes') {
      // Open a fresh panel so Reader records this recovery entry as its opener.
      H.state.context = null;
      H.go('reader');
      if (H.state.route === 'reader') {
        const opener = H.$('banner')?.querySelector('[data-action="recovery:notes"]');
        H.readerAction('context:notes', opener);
      }
    } else if (target === 'coverage' || target === 'drafts') {
      H.state.report = target;
      H.go('maintenance');
    } else {
      return coreAction.apply(this, arguments);
    }
    return true;
  };
})(window.HR);


HR.start();
</script>
</body></html>
