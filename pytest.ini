[pytest]
minversion = 9.1.1
testpaths = tests/contracts docs/testing/test_validate_docs.py tests/e2e
addopts = --strict-config --strict-markers -ra -p no:cacheprovider
filterwarnings = error
markers =
    unit: one logical unit with no separately managed external resource
    integration: self-contained contract or documentation-tool cooperation without a real database
    e2e: public interfaces of the built production headless executable and a test-owned SQLite profile
