version: 2
commands:
  docs-integrity:
    command: ["python3", "-B", "docs/testing/validate_docs.py"]
    tags: [docs, validation]
    parser: generic
    timeout_sec: 120
  test:
    command: ["make", "test"]
    tags: [test, validation]
    parser: generic
    timeout_sec: 18900
  test-prepare:
    command: ["make", "test-prepare"]
    tags: [test, validation]
    parser: generic
    timeout_sec: 600
  test-unit:
    command: ["make", "test-unit"]
    tags: [test, validation]
    parser: generic
    timeout_sec: 300
  test-int:
    command: ["make", "test-int"]
    tags: [test, validation]
    parser: generic
    timeout_sec: 300
  test-e2e:
    command: ["make", "test-e2e"]
    tags: [test, validation]
    parser: generic
    timeout_sec: 18900
  test-persistence:
    command: ["make", "test-persistence"]
    tags: [test, validation]
    parser: generic
    timeout_sec: 9000
